# Cache-Control is decided here rather than in a location block, and the reason
# is the trap in nginx's add_header: a location that sets one header of its own
# discards every header inherited from the server block. The two locations that
# used to carry Cache-Control would therefore have served the model with none of
# the security headers below — the only two paths that matter, since one is the
# page and the other is the whole bundle. Choosing the value by $uri instead
# keeps every add_header in one place, where a location added later cannot
# silently drop it.
#
# It also closes a hole the location blocks had: `location = /index.html`
# matches that literal path and nothing else, so a request for `/` — which is
# how everybody actually opens the page — got no Cache-Control at all.
map $uri $cache_control {
    # Vite puts a content hash in every asset filename, so a file under /assets/
    # can never change meaning: it is safe to cache until it is forgotten.
    ~^/assets/  "public, max-age=31536000, immutable";
    # index.html carries the pointers to those hashed names. Cache it and a
    # deploy becomes invisible: the browser keeps asking for yesterday's
    # filenames, which are still there and still work.
    default     "no-cache";
}

server {
    listen      5188;
    listen      [::]:5188;
    server_name _;

    root  /usr/share/nginx/html;
    index index.html;

    # The version goes out in the Server header of every response and on every
    # error page. It tells a scanner which nginx advisories to try and tells a
    # reader nothing, so it is worth exactly one line to stop sending it.
    server_tokens off;

    # The 198 kB quoted throughout the documentation is a gzipped figure, and it
    # is only what goes over the wire if the server compresses the same way.
    # Two defaults get in the way. gzip_types is text/html alone, which would
    # send the 731 kB bundle — the whole of the payload — uncompressed. And
    # gzip_comp_level is 1, which delivers it in 234.9 kB — 19 % more than
    # level 6 sends, and the sort of gap nobody would think to look for.
    # Level 6 brings it to 196.8 kB — not identical to Vite's 198.29, since the
    # two use different zlib window and memory settings, but on the right side
    # of it, so the documented number is an upper bound on what is served.
    gzip             on;
    gzip_vary        on;
    gzip_comp_level  6;
    gzip_min_length  1024;
    gzip_types       text/css application/javascript image/svg+xml application/json;

    # `always`, so the headers survive on error responses too. Without it the
    # 404 that `try_files` produces below would come back bare.
    add_header Cache-Control $cache_control always;

    # This page loads nothing from anywhere. The script and the stylesheet are
    # its own, the favicon is a data: URI, there are no fonts, no images, no
    # requests at run time at all — no fetch, no XHR, no WebSocket. A policy
    # that says so is therefore not a compromise between safety and function,
    # and it is worth writing down before that stops being true.
    #
    #   script-src 'self'   — one bundle, no inline script; checked against
    #                         dist/index.html, which carries a single <script src>
    #   style-src  unsafe-inline — the legend rows in index.html carry inline
    #                         style="" attributes for their gradient swatches.
    #                         Only attributes; there is no inline <style>.
    #   img-src    data:    — the favicon is an inline SVG in a <link rel=icon>
    #   frame-ancestors 'none' — nothing here is meant to be embedded, and the
    #                         controls are a panel of sliders worth clickjacking
    #                         exactly as much as any other set of buttons
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; object-src 'none'; base-uri 'none'; form-action 'none'; frame-ancestors 'none'" always;

    # The bundle is served as application/javascript and the page as text/html,
    # so nothing here depends on sniffing; this only removes the chance that a
    # future file is guessed into something executable.
    add_header X-Content-Type-Options "nosniff" always;

    # There is nothing in the URL worth leaking — one page, no routes, no query
    # string — but there is also no outbound navigation that would need a
    # referrer, so the strictest value costs nothing.
    add_header Referrer-Policy "no-referrer" always;

    # 404 rather than the usual SPA fallback to index.html. There is no router
    # here — one page, no client-side routes — so serving the model in answer
    # to a mistyped path would hide the mistake rather than report it.
    location / {
        try_files $uri $uri/ =404;
    }
}
